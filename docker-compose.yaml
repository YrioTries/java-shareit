version: '3.8'

services:
  db:
    image: postgres:16.1
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=shareit
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=12345
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  # Сервер
  server:
    build:
      context: C:\Users\Дмитрий\IdeaProjects\java-shareit
      dockerfile: server/Dockerfile
    ports:
      - "9090:9090"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/shareit
      - SPRING_DATASOURCE_USERNAME=dbuser
      - SPRING_DATASOURCE_PASSWORD=12345
    networks:
      - shareit-network

  # Gateway
  gateway:
    build:
      context: C:\Users\Дмитрий\IdeaProjects\java-shareit
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - shareit-server
    environment:
      - SERVER_URL=http://shareit-server:9090
    networks:
      - shareit-network

networks:
  shareit-network:
    driver: bridge